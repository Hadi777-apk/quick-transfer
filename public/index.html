            { "@type": "Question", "name": "数据保留多久？", "acceptedAnswer": { "@type": "Answer", "text": "所有数据仅保留2小时，之后自动从服务器彻底删除。开启阅后即焚模式后，内容首次查看后立即销毁。" } },

<body>

<!-- ====== 顶部品牌 ====== -->
<header class="site-header">
    <div class="brand" onclick="location.href='/'" style="cursor:pointer">
        <img class="brand-icon" src="/favicon.png" alt="P2P快传">
        <h1 style="font-size:1.25rem;margin:0;font-weight:700;color:var(--text-main);">P2P快传</h1>
    </div>
</header>

<!-- ====== 核心工具区 (保持原有 DOM 结构不变) ====== -->
<main class="main-content">
    <div class="action-card">
        <h2 id="action-title" class="card-title">分享文字、图片和文件</h2>
        <p class="limit-hint">文字最多 20000 字 · 附件最多 20 个、总计 200MB</p>

        <div id="area-send" class="input-group">
            <div id="share-composer" class="share-composer">
                <textarea id="input-text-val" autofocus aria-label="分享内容" placeholder="输入文字，或直接 Ctrl+V 粘贴文字、图片和文件…"></textarea>
                <div id="attachment-grid" class="attachment-grid"></div>
                <div class="composer-toolbar">
                    <button id="add-attachments" type="button" onclick="document.getElementById('input-attachments').click()">＋ 添加图片 / 文件</button>
                    <button id="btn-paste" type="button" onclick="handlePaste()">粘贴</button>
                    <input type="file" id="input-attachments" multiple hidden>
                </div>
                <div class="composer-hint">也可以把图片或文件拖到这里</div>
            </div>
            <div id="attachment-summary" class="attachment-summary" aria-live="polite"></div>
        </div>

        <div id="area-receive" class="input-group" style="display:none;">
            <input type="text" id="input-code-val" class="code-input" maxlength="4" inputmode="numeric" pattern="[0-9]*" enterkeyhint="go" placeholder="在此输入取件码" autocomplete="one-time-code">
        </div>

        <div id="options-panel" class="options-group">
            <label class="checkbox-label" title="纯文字查看后销毁；含附件时，全部附件下载完成后销毁">
                <input type="checkbox" id="burn-mode">
                <span class="custom-checkbox"></span>
                <span class="label-text">阅后即焚</span>
            </label>
        </div>

        <button class="btn-submit" id="main-btn" onclick="handleSubmit()">生成取件码</button>

        <div id="switch-area" class="quick-switch-box"></div>
        <div id="result-panel" class="result-panel"></div>
    </div>
</main>
